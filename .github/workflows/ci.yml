name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  consistency:
    name: version + supply-chain checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version / documented-count consistency
        run: npm run check:versions
      - name: Dependency audit (runtime deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (didcomm adapter, high+)
        working-directory: packages/atlas-didcomm-adapter
        run: npm audit --omit=dev --audit-level=high


  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package contents include the server entry point
        run: npm pack --dry-run 2>&1 | tee /dev/stderr | grep -q 'dist/index.js'

  adapter:
    name: didcomm-adapter (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: packages/atlas-didcomm-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/atlas-didcomm-adapter/package-lock.json
      - run: npm ci
      - run: npm test
